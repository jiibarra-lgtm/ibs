# Avisa a Bing y otros buscadores (IndexNow) cada vez que Vercel termina un deploy de producción.
name: IndexNow
on:
  deployment_status:
jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sleep 30 && node scripts/seo/indexnow.mjs
